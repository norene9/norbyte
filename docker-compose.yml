version: "3.8"

services:
  db:
    image: postgres:15-alpine
    container_name: norbyte_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - norbyte_network
  pgadmin:
    image: dpage/pgadmin4
    container_name: norbyte_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db
    networks:
      - norbyte_network
  redis:
    image: redis:6-alpine
    container_name: norbyte_redis
    restart: always
    networks:
      - norbyte_network

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: norbyte_api
    restart: always
    working_dir: /app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
      - uploads_data:/data/uploads
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
    depends_on:
      - db
      - redis
    networks:
      - norbyte_network

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: norbyte_worker
    restart: always
    working_dir: /app
    command: celery -A app.tasks.celery_worker worker --loglevel=info
    volumes:
      - ./backend:/app
      - uploads_data:/data/uploads
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
    depends_on:
      - db
      - redis
    networks:
      - norbyte_network

  nginx:
    image: nginx:alpine
    container_name: norbyte_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro # Added :ro for read-only safety
    depends_on:
      - api
    networks:
      - norbyte_network

volumes:
  db_data:
  uploads_data:

networks:
  norbyte_network:
    driver: bridge
