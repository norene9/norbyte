version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: norbyte_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - norbyte_network

  redis:
    image: redis:6-alpine
    container_name: norbyte_redis
    restart: always
    networks:
      - norbyte_network

  api:
    build: .
    container_name: norbyte_api
    restart: always
    # ❌ CRITICAL FIX: Changed from '--host' to '--host 0.0.0.0 --port 8000 --reload'
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/workspace
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
    depends_on:
      - db
      - redis
    networks:
      - norbyte_network

  worker:
    build: .
    container_name: norbyte_worker
    restart: always
    command: celery -A worker.celery_app worker --loglevel=info
    volumes:
      - .:/workspace
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
    depends_on:
      - db
      - redis
    networks:
      - norbyte_network

  nginx:
    image: nginx:alpine
    container_name: norbyte_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro # Added :ro for read-only safety
    depends_on:
      - api
    networks:
      - norbyte_network

volumes:
  db_data:

networks:
  norbyte_network:
    driver: bridge
